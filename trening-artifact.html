<title>Trening — Powrót do siły</title>
<style>
/* ============================================================
   Design tokens — "iron & chalk": rubber gym flooring + chalk
   dust neutrals, a burnt-iron accent, and plate-colour semantics
   (green/amber/red are literally competition plate colours,
   reused here for progression state: safe / caution / stop).
   ============================================================ */
:root {
  --bg: #f2efe8;
  --surface: #fbfaf6;
  --surface-2: #eae6da;
  --border: #ddd6c6;
  --text: #201c15;
  --text-muted: #6f6a5c;
  --accent: #b6491f;
  --accent-strong: #943915;
  --accent-contrast: #fff8f0;
  --accent-bg: #f5e1d2;
  --good: #3f7a45;
  --good-bg: #e2ecdf;
  --warn: #93701c;
  --warn-bg: #f1e7cc;
  --danger: #a3332a;
  --danger-bg: #f4dfda;
  --shadow: 0 1px 2px rgba(32, 28, 21, 0.06), 0 8px 24px rgba(32, 28, 21, 0.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a;
    --surface: #1e2124;
    --surface-2: #272b2f;
    --border: #34383c;
    --text: #f1efe8;
    --text-muted: #9c988d;
    --accent: #e2712c;
    --accent-strong: #f08a44;
    --accent-contrast: #17130d;
    --accent-bg: #3a2718;
    --good: #6bab70;
    --good-bg: #1f2c20;
    --warn: #d3ac48;
    --warn-bg: #33291a;
    --danger: #dc6a5c;
    --danger-bg: #3a2320;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1e2124; --surface-2: #272b2f; --border: #34383c;
  --text: #f1efe8; --text-muted: #9c988d;
  --accent: #e2712c; --accent-strong: #f08a44; --accent-contrast: #17130d; --accent-bg: #3a2718;
  --good: #6bab70; --good-bg: #1f2c20;
  --warn: #d3ac48; --warn-bg: #33291a;
  --danger: #dc6a5c; --danger-bg: #3a2320;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
}
:root[data-theme="light"] {
  --bg: #f2efe8; --surface: #fbfaf6; --surface-2: #eae6da; --border: #ddd6c6;
  --text: #201c15; --text-muted: #6f6a5c;
  --accent: #b6491f; --accent-strong: #943915; --accent-contrast: #fff8f0; --accent-bg: #f5e1d2;
  --good: #3f7a45; --good-bg: #e2ecdf;
  --warn: #93701c; --warn-bg: #f1e7cc;
  --danger: #a3332a; --danger-bg: #f4dfda;
  --shadow: 0 1px 2px rgba(32, 28, 21, 0.06), 0 8px 24px rgba(32, 28, 21, 0.07);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: calc(122px + env(safe-area-inset-bottom));
  transition: background 0.15s ease, color 0.15s ease;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
:focus:not(:focus-visible) { outline: none; }
.mono, .tgt-main, .tgt-weight, .rt-time, .session-progress, .set-done, .pbar span,
.c-val, .c-date, .nu-field input, .week-ctl b, .set-input-title {
  font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
.hidden { display: none !important; }
.muted { color: var(--text-muted); font-size: 0.85rem; }

/* ---------- topbar ---------- */
#topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 1px solid var(--border);
}
#topbar-title { font-weight: 800; font-size: 1.1rem; letter-spacing: 0.01em; }
.app-ver { font-size: 0.62rem; font-weight: 600; color: var(--muted); vertical-align: middle; margin-left: 2px; }
#topbar-meta { color: var(--text-muted); font-size: 0.78rem; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }

/* ---------- main ---------- */
#view { padding: 12px 12px 20px; max-width: 640px; margin: 0 auto; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 8px; font-size: 1rem; text-wrap: balance; }
.card.empty { text-align: center; color: var(--text-muted); padding: 32px 14px; }
.sec-title {
  margin: 18px 4px 8px; font-size: 0.72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted);
}

.banner {
  border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  font-size: 0.9rem; line-height: 1.4; border: 1px solid transparent;
}
.banner-warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.banner-info { background: var(--accent-bg); color: var(--accent-strong); border-color: color-mix(in srgb, var(--accent) 30%, transparent); cursor: pointer; }

/* ---------- day picker ---------- */
.day-picker { display: flex; gap: 8px; margin: 4px 0 10px; }
.day-btn {
  flex: 1; padding: 14px 0; font-size: 1.3rem; font-weight: 800;
  font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
  background: var(--surface); color: var(--text-muted);
  border: 1.5px solid var(--border); border-radius: 12px;
  position: relative; cursor: pointer; transition: transform 0.1s ease;
}
.day-btn:active { transform: scale(0.97); }
.day-btn.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
.day-sug {
  position: absolute; top: 4px; right: 6px;
  font-size: 0.55rem; font-weight: 700; letter-spacing: 0.04em;
  color: var(--good); font-family: -apple-system, sans-serif;
}
.day-btn.active .day-sug { color: var(--accent-contrast); opacity: 0.85; }
.day-label { text-align: center; color: var(--text-muted); margin-bottom: 12px; font-size: 0.88rem; }

/* ---------- exercise cards ---------- */
/* Left rail encodes real state, not decoration: new = unevaluated,
   ok = clear to progress, caution = hold steady, stop = paused/blocked. */
.ex-card {
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--text-muted);
  border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.ex-card.st-new { border-left-color: var(--text-muted); }
.ex-card.st-ok, .ex-card.st-done, .ex-card.ex-done { border-left-color: var(--good); }
.ex-card.st-caution { border-left-color: var(--warn); }
.ex-card.st-blocked, .ex-card.st-stop, .ex-card.ex-paused { border-left-color: var(--danger); opacity: 0.92; }
.ex-card.ex-done { opacity: 0.82; }
.ex-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.ex-name { font-weight: 700; font-size: 1.03rem; line-height: 1.3; text-wrap: balance; }
.ex-badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
.chip {
  font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 4px 8px; border-radius: 20px;
  background: var(--surface-2); color: var(--text-muted); white-space: nowrap;
  border: none; cursor: pointer;
}
.chip-straps { background: var(--warn-bg); color: var(--warn); }
.chip-warn { background: var(--danger-bg); color: var(--danger); }
.chip-hint { background: var(--accent-bg); color: var(--accent-strong); }
.chip-hist { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }

.ex-targets { display: flex; gap: 14px; align-items: baseline; margin: 10px 0 4px; }
.tgt-main { font-size: 1.55rem; font-weight: 700; }
.tgt-weight { font-size: 1.55rem; font-weight: 700; color: var(--accent); }
.ex-sub { color: var(--text-muted); font-size: 0.78rem; line-height: 1.45; }
.straps-note {
  margin-top: 8px; padding: 8px 10px; border-radius: 8px;
  background: var(--warn-bg); color: var(--warn); font-size: 0.82rem; font-weight: 600;
}
.paused-line { color: var(--danger); font-size: 0.85rem; margin: 6px 0; font-weight: 600; }

/* ---------- set logging ---------- */
.set-done {
  display: flex; gap: 12px; align-items: center;
  background: var(--surface-2); border-radius: 8px;
  padding: 8px 12px; margin-top: 8px; font-size: 0.92rem;
}
.set-no { color: var(--text-muted); font-weight: 700; }
.pain-lo { color: var(--good); } .pain-mid { color: var(--warn); } .pain-hi { color: var(--danger); font-weight: 700; }

.set-input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 10px; }
.set-input-title { font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
.si-row { display: flex; gap: 10px; }
.si-field { flex: 1; margin-bottom: 10px; }
.si-field label {
  display: block; font-size: 0.68rem; color: var(--text-muted); margin-bottom: 4px;
  text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
}

.stepper { display: flex; align-items: stretch; gap: 6px; }
.stepper button {
  width: 44px; min-height: 44px; font-size: 1.4rem; font-weight: 700;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; transition: transform 0.1s ease;
}
.stepper button:active { transform: scale(0.94); }
.stepper input {
  flex: 1; width: 100%; min-width: 0; text-align: center;
  font-size: 1.25rem; font-weight: 700;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px;
}

.rpe-chips, .pain-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.pchip {
  min-width: 40px; min-height: 42px; border-radius: 9px;
  background: var(--surface); color: var(--text-muted);
  border: 1.5px solid var(--border); font-size: 1rem; font-weight: 700; cursor: pointer;
  font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
  transition: transform 0.1s ease;
}
.pchip:active { transform: scale(0.93); }
.pain-chips .pchip { min-width: 27px; min-height: 40px; font-size: 0.9rem; flex: 1; }
/* unselected tier tint — shows the RPE/pain gradient before you pick */
.pchip.plo { background: color-mix(in srgb, var(--good) 10%, var(--surface)); border-color: color-mix(in srgb, var(--good) 30%, var(--border)); }
.pchip.pmid { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 32%, var(--border)); }
.pchip.phi { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); border-color: color-mix(in srgb, var(--danger) 32%, var(--border)); }
.pchip.sel.plo, .pchip.sel { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.pchip.sel.pmid { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
.pchip.sel.phi { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }

/* ---------- buttons ---------- */
.btn {
  padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text);
  font-size: 0.98rem; font-weight: 700; cursor: pointer; transition: transform 0.1s ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
.btn-danger { background: var(--danger); color: var(--accent-contrast); border-color: var(--danger); }
.btn-ghost { background: transparent; color: var(--text-muted); border-color: transparent; }
.btn-full { display: block; width: 100%; margin-top: 10px; }
.btn-big { padding: 18px; font-size: 1.1rem; }
.btn-sm { padding: 6px 14px; font-size: 1rem; }
.link-btn {
  background: none; border: none; color: var(--accent);
  font-size: 0.85rem; cursor: pointer; padding: 8px 4px; text-decoration: underline;
}
.skip-link { display: block; margin: 6px auto 0; color: var(--text-muted); }

/* ---------- session ---------- */
.session-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted);
}
.session-progress { font-weight: 800; color: var(--accent); font-size: 1.05rem; }

/* ---------- follow-up ---------- */
.followup { border-color: var(--warn); }
.fu-title { font-weight: 700; margin-bottom: 10px; color: var(--warn); }
.fu-row { margin-bottom: 10px; }
.fu-ex { font-size: 0.85rem; margin-bottom: 4px; }

/* ---------- rest timer ---------- */
#rest-timer {
  position: fixed; left: 8px; right: 8px;
  bottom: calc(78px + env(safe-area-inset-bottom));
  background: var(--accent); color: var(--accent-contrast); border-radius: 16px;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; z-index: 30;
  box-shadow: var(--shadow); transition: background 0.2s ease;
}
#rest-timer.rt-done { background: var(--good); animation: pulse 0.7s infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.025); } }
.rt-info { flex: 1; min-width: 0; }
.rt-label { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; opacity: 0.85; text-transform: uppercase; }
.rt-ex { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt-time { font-size: 2rem; font-weight: 700; }
.rt-actions { display: flex; gap: 6px; }
.rt-btn {
  background: color-mix(in srgb, var(--accent-contrast) 20%, transparent); color: var(--accent-contrast);
  border: none; border-radius: 8px; padding: 8px 10px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
}

/* ---------- tabbar ---------- */
#tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 25;
  display: flex; background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1; padding: 10px 0 8px;
  background: none; border: none; color: var(--text-muted);
  font-size: 0.66rem; font-weight: 600; letter-spacing: 0.02em; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tab.active { color: var(--accent); }
.tab-ico { font-size: 1.3rem; }
.badge {
  display: inline-block; background: var(--danger); color: var(--accent-contrast);
  border-radius: 10px; padding: 0 5px; font-size: 0.6rem; margin-left: 3px;
}

/* ---------- modal / toast ---------- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(10, 8, 5, 0.55);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
  max-width: 420px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow);
}
.modal h3 { margin: 0 0 10px; text-wrap: balance; }
.modal p { margin: 0 0 10px; line-height: 1.5; font-size: 0.92rem; }
.modal-btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.modal-btns .btn { flex: 1; }
.hint-line { color: var(--accent-strong); }
.warn-line { color: var(--warn); }
.toast {
  position: fixed; bottom: calc(142px + env(safe-area-inset-bottom));
  left: 16px; right: 16px; z-index: 60;
  background: var(--text); color: var(--bg);
  border-radius: 12px; padding: 12px 16px;
  font-size: 0.9rem; line-height: 1.4; text-wrap: balance;
  opacity: 0; transform: translateY(10px); transition: all 0.3s;
  box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: none; }

/* ---------- history ---------- */
.session-card summary { cursor: pointer; font-size: 0.95rem; padding: 2px 0; }
.hist-ex { margin: 8px 0; font-size: 0.85rem; line-height: 1.55; }
.select-full {
  width: 100%; padding: 10px; border-radius: 10px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); font-size: 0.95rem; margin-bottom: 8px;
}
.chart { width: 100%; height: auto; margin-top: 4px; overflow: visible; }
.c-line { fill: none; stroke: var(--accent); stroke-width: 3; }
.c-dot { fill: var(--accent); }
.c-dot-pain { fill: var(--danger); }
.c-grid { stroke: var(--border); stroke-width: 1; }
.c-txt { fill: var(--text-muted); font-size: 12px; }
.c-val { fill: var(--text); font-weight: 700; text-anchor: middle; }
.c-date { text-anchor: middle; font-size: 11px; }
.chart-legend { margin-top: 4px; }

/* ---------- nutrition ---------- */
.nu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nu-field label {
  display: block; font-size: 0.68rem; color: var(--text-muted); margin-bottom: 4px;
  text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
}
.nu-field input {
  width: 100%; padding: 12px; border-radius: 10px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); font-size: 1.08rem; font-weight: 700; text-align: center;
}
.nu-checks { margin-top: 12px; }
.check {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 8px; font-size: 0.88rem; cursor: pointer; line-height: 1.4;
}
.check.on { border-color: var(--good); background: var(--good-bg); }
.check input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--good); }
.pbar {
  position: relative; height: 30px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; margin-top: 12px; overflow: hidden;
}
.pbar-fill { height: 100%; background: var(--warn); transition: width 0.3s; }
.pbar-fill.ok { background: var(--good); }
.pbar span {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; color: var(--text);
}
.rules { margin: 0; padding-left: 18px; font-size: 0.85rem; line-height: 1.6; color: var(--text); }
.rules li { margin-bottom: 6px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.tbl th, .tbl td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl th { color: var(--text-muted); font-weight: 600; }
.nu-hist { font-size: 0.82rem; padding: 5px 0; border-bottom: 1px solid var(--border); color: var(--text); }

/* ---------- rehab ---------- */
.rehab-check { align-items: center; }
.rehab-week { display: flex; gap: 6px; }
.rw-day {
  flex: 1; text-align: center; padding: 8px 0;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  font-size: 0.75rem; color: var(--text-muted); font-family: ui-monospace, 'SF Mono', monospace;
}
.rw-day.ok { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }

/* ---------- plan ---------- */
.week-ctl { display: flex; align-items: center; gap: 10px; font-size: 1rem; }
.gate-check { padding: 5px 0; font-size: 0.88rem; }
.plan-ex { padding: 10px 0; border-bottom: 1px solid var(--border); }
.plan-ex:last-child { border-bottom: none; }

@media (min-width: 640px) {
  html { font-size: 17px; }
}

/* wide content never forces the page to scroll sideways */
.tbl, .chart { max-width: 100%; }

/* RPE helper + video + rozgrzewka */
.rpe-q {
  background: none; border: none; color: var(--accent);
  font-size: 0.75rem; cursor: pointer; padding: 2px 4px; text-decoration: underline dotted;
}
.rpe-q-card { display: block; margin-top: 8px; font-size: 0.82rem; padding: 4px 0; }
.video-btn { text-decoration: none; text-align: center; background: var(--accent2); color: #fff; }
.warmup-card { border-left: 4px solid var(--warn); }
.warmup-card summary { cursor: pointer; font-weight: 700; padding: 2px 0; }
.warmup-step {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 0; border-bottom: 1px solid var(--card2);
  font-size: 0.88rem; line-height: 1.4;
}
.warmup-step:last-child { border-bottom: none; }
.warmup-step input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--ok); }
.warmup-step.done span { opacity: 0.55; text-decoration: line-through; }
</style>

<header id="topbar">
  <div id="topbar-title">Trening <span id="app-ver" class="app-ver"></span></div>
  <div id="topbar-meta"></div>
</header>

<main id="view"></main>

<div id="rest-timer" class="hidden">
  <div class="rt-info">
    <div class="rt-label">Przerwa</div>
    <div class="rt-ex"></div>
  </div>
  <div class="rt-time">0:00</div>
  <div class="rt-actions">
    <button class="rt-btn" data-rt="-15">−15s</button>
    <button class="rt-btn" data-rt="+15">+15s</button>
    <button class="rt-btn rt-skip" data-rt="skip">Pomiń</button>
  </div>
</div>

function slugify(name) {
  return String(name).toLowerCase()
    .replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'cwiczenie';
}

// Waliduje i normalizuje plik od trenera do struktury wewnętrznej.
// Zwraca { plan, errors } — plan tylko gdy errors puste.
function parseTrainerPlan(obj) {
  const errors = [];
  const err = m => errors.push(m);
  if (!obj || typeof obj !== 'object') { err('Plik nie jest poprawnym JSON-em.'); return { errors }; }
  const info = obj.plan_info || {};
  const treningi = obj.treningi;
  if (!Array.isArray(treningi) || !treningi.length) { err('Brak listy "treningi" albo jest pusta.'); return { errors }; }

  const workouts = [];
  treningi.forEach((t, ti) => {
    const where = `Trening ${ti + 1}${t && t.data ? ' (' + t.data + ')' : ''}`;
    if (!t || typeof t !== 'object') { err(`${where}: niepoprawny wpis.`); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.data || '')) err(`${where}: pole "data" musi mieć format RRRR-MM-DD (np. 2026-08-03).`);
    if (!t.nazwa) err(`${where}: brak pola "nazwa" (np. "A — nogi + plecy").`);
    if (!Array.isArray(t.cwiczenia) || !t.cwiczenia.length) { err(`${where}: brak listy "cwiczenia".`); return; }
    const wRpe = t.rpe_cel != null ? +t.rpe_cel : null;
    if (wRpe != null && !(wRpe >= 1 && wRpe <= 10)) err(`${where}: "rpe_cel" musi być w zakresie 1–10.`);

    const items = t.cwiczenia.map((c, ci) => {
      const cw = `${where}, ćwiczenie ${ci + 1}${c && c.nazwa ? ' (' + c.nazwa + ')' : ''}`;
      if (!c || !c.nazwa) { err(`${cw}: brak pola "nazwa".`); return null; }
      const sets = +c.serie;
      if (!(sets >= 1 && sets <= 20)) err(`${cw}: "serie" musi być liczbą 1–20.`);
      if (c.powtorzenia == null || c.powtorzenia === '') err(`${cw}: brak pola "powtorzenia" (np. "10-12" albo "do RPE 7").`);
      const rest = +c.przerwa_s;
      if (!(rest >= 10 && rest <= 600)) err(`${cw}: "przerwa_s" musi być liczbą sekund 10–600.`);
      const weight = (c.ciezar_kg === null || c.ciezar_kg === undefined || c.ciezar_kg === '') ? null : +c.ciezar_kg;
      if (weight != null && !(weight >= 0 && weight < 1000)) err(`${cw}: "ciezar_kg" musi być liczbą (kg) albo null.`);
      const cRpe = c.rpe_cel != null ? +c.rpe_cel : null;
      if (cRpe != null && !(cRpe >= 1 && cRpe <= 10)) err(`${cw}: "rpe_cel" musi być w zakresie 1–10.`);
      let elbow = c.bezpieczne_dla_lokcia;
      if (elbow === undefined) elbow = true;
      if (typeof elbow === 'string') {
        const e = elbow.toLowerCase();
        elbow = (e === 'ostrzezenie' || e === 'ostrzeżenie' || e === 'warn') ? 'warn'
          : (e === 'true' || e === 'tak') ? true
          : (e === 'false' || e === 'nie') ? false : null;
        if (elbow === null) { err(`${cw}: "bezpieczne_dla_lokcia" musi być true / false / "ostrzezenie".`); elbow = 'warn'; }
      }
      return {
        ex: c.id ? slugify(c.id) : slugify(c.nazwa),
        name: String(c.nazwa),
        sets: sets || 3,
        reps: String(c.powtorzenia),
        weight,
        weightLabel: c.ciezar_opis ? String(c.ciezar_opis) : null,
        tempo: c.tempo ? String(c.tempo) : '—',
        rest: rest || 90,
        restLabel: c.przerwa_opis ? String(c.przerwa_opis) : null,
        rpeTarget: cRpe,
        elbowSafe: elbow,
        straps: !!c.paski,
        optional: !!c.opcjonalne,
        hint: c.wskazowka ? String(c.wskazowka) : null,
        video: c.video ? String(c.video) : null,
        warnings: Array.isArray(c.uwagi) ? c.uwagi.map(String) : (c.uwagi ? [String(c.uwagi)] : [])
      };
    }).filter(Boolean);

    workouts.push({
      id: ti + 1,
      date: String(t.data),
      name: String(t.nazwa || 'Trening'),
      week: t.tydzien != null ? +t.tydzien : null,
      rpeTarget: wRpe,
      notes: t.uwagi ? String(t.uwagi) : null,
      warmup: Array.isArray(t.rozgrzewka) ? t.rozgrzewka.map(String)
        : (t.rozgrzewka ? String(t.rozgrzewka).split(';').map(s => s.trim()).filter(Boolean)
        : (Array.isArray(info.rozgrzewka) ? info.rozgrzewka : null)),
      items
    });
  });

  if (errors.length) return { errors };
  workouts.sort((a, b) => a.date < b.date ? -1 : 1);
  workouts.forEach((w, i) => w.id = i + 1);
  return {
    plan: {
      meta: {
        trener: info.trener ? String(info.trener) : null,
        zawodnik: info.zawodnik ? String(info.zawodnik) : null,
        nazwa: info.nazwa ? String(info.nazwa) : 'Plan od trenera',
        opis: info.opis ? String(info.opis) : null,
        uwagi: info.uwagi_ogolne ? String(info.uwagi_ogolne) : null
      },
      workouts
    },
    errors: []
  };
}

// ---------------- Parser Markdown (format zalecany dla trenera) ----------------
function normDate(s) {
  let m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return s.trim();
  m = String(s).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return null;
}

// Zamienia plan w Markdown (nagłówki ## + tabele) na strukturę jak z pliku JSON.
function parseTrainerPlanMd(text) {
  const errors = [];
  const info = {};
  const treningi = [];
  let cur = null;
  const lines = text.split(/\r?\n/);

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line || line.startsWith('<!--')) continue;

    if (line.startsWith('# ') && !line.startsWith('## ')) {
      info.nazwa = line.slice(2).replace(/^Plan\s*:\s*/i, '').trim();
      continue;
    }
    if (line.startsWith('## ')) {
      const segs = line.slice(3).split('|').map(s => s.trim());
      const date = normDate(segs[0]);
      if (!date) errors.push(`Linia ${i + 1}: nagłówek treningu musi zaczynać się datą (RRRR-MM-DD albo DD.MM.RRRR), jest: "${segs[0]}".`);
      cur = { data: date || segs[0], nazwa: segs[1] || 'Trening', cwiczenia: [] };
      for (const s of segs.slice(2)) {
        const t = s.toLowerCase();
        const num = parseFloat(s.replace(',', '.').replace(/[^\d.,]/g, ''));
        if (t.includes('tydz') && !isNaN(num)) cur.tydzien = num;
        else if (t.includes('rpe') && !isNaN(num)) cur.rpe_cel = num;
      }
      treningi.push(cur);
      continue;
    }
    const kv = line.match(/^(Trener|Zawodnik|Opis|Uwagi|Rozgrzewka)\s*:\s*(.+)$/i);
    if (kv && !line.startsWith('|')) {
      const k = kv[1].toLowerCase();
      if (cur) {
        if (k === 'uwagi') cur.uwagi = kv[2].trim();
        else if (k === 'rozgrzewka') cur.rozgrzewka = kv[2].split(';').map(s => s.trim()).filter(Boolean);
      }
      else if (k === 'rozgrzewka') info.rozgrzewka = kv[2].split(';').map(s => s.trim()).filter(Boolean);
      else if (k === 'trener') info.trener = kv[2].trim();
      else if (k === 'zawodnik') info.zawodnik = kv[2].trim();
      else if (k === 'opis') info.opis = kv[2].trim();
      else if (k === 'uwagi') info.uwagi_ogolne = kv[2].trim();
      continue;
    }
    if (line.startsWith('|')) {
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      if (!cells.length || cells.every(c => /^:?-{2,}:?$/.test(c))) continue; // separator |---|
      const first = cells[0].toLowerCase();
      if (first.startsWith('ćwicz') || first.startsWith('cwicz')) continue;   // wiersz nagłówka
      if (!cur) { errors.push(`Linia ${i + 1}: tabela ćwiczeń przed nagłówkiem treningu (##).`); continue; }
      if (cells.length < 6) {
        errors.push(`Linia ${i + 1}: wiersz ma ${cells.length} kolumn, potrzeba 8: Ćwiczenie | Serie×Powt. | Ciężar | Tempo | Przerwa | RPE | Flagi | Wskazówka.`);
        continue;
      }
      const [nameCell, sxr, wCell, tempoCell, restCell, rpeCell, flagCell = '', hintCell = '', videoCell = ''] = cells;
      const empty = v => v === '' || v === '-' || v === '—';

      let name = nameCell, id;
      const idm = nameCell.match(/\[([^\]]+)\]\s*$/);
      if (idm) { id = idm[1]; name = nameCell.slice(0, idm.index).trim(); }

      const sm = sxr.replace('×', 'x').match(/^\s*(\d+)\s*x\s*(.+)$/i);
      if (!sm) errors.push(`Linia ${i + 1} (${name}): Serie×Powt. musi mieć format "3x10-12", jest: "${sxr}".`);

      let ciezar_kg = null, ciezar_opis;
      const wNorm = wCell.replace(',', '.').replace(/\s*kg\s*$/i, '').trim();
      if (!empty(wCell)) {
        if (/^\d+(\.\d+)?$/.test(wNorm)) ciezar_kg = parseFloat(wNorm);
        else ciezar_opis = wCell;
      }

      const restNums = restCell.match(/\d+/g);
      if (!restNums) errors.push(`Linia ${i + 1} (${name}): Przerwa musi zawierać liczbę sekund, jest: "${restCell}".`);
      const przerwa_s = restNums ? +restNums[restNums.length - 1] : 0;
      const przerwa_opis = /^\d+\s*s?$/.test(restCell) ? undefined : restCell;

      const rpe = empty(rpeCell) ? undefined : parseFloat(rpeCell.replace(',', '.'));
      const flags = flagCell.toLowerCase();
      let lok = true;
      if (/\bnie\b|wyklucz/.test(flags)) lok = false;
      else if (/uwaga|ostrz|łokieć|lokiec|warn/.test(flags)) lok = 'ostrzezenie';

      cur.cwiczenia.push({
        id, nazwa: name,
        serie: sm ? +sm[1] : 0,
        powtorzenia: sm ? sm[2].trim() : sxr,
        ciezar_kg, ciezar_opis,
        tempo: empty(tempoCell) ? undefined : tempoCell,
        przerwa_s, przerwa_opis,
        rpe_cel: rpe,
        bezpieczne_dla_lokcia: lok,
        paski: /pask/.test(flags),
        opcjonalne: /opcjo/.test(flags),
        wskazowka: empty(hintCell) ? undefined : hintCell,
        video: empty(videoCell) ? undefined : videoCell
      });
      continue;
    }
  }
  if (!treningi.length) errors.push('Nie znaleziono żadnego treningu. Każdy trening zaczyna się linią "## RRRR-MM-DD | nazwa treningu".');
  return { obj: { plan_info: info, treningi }, errors };
}

// Wczytuje plan z tekstu — Markdown (zalecany) albo JSON (też akceptowany).
function parseTrainerPlanText(txt) {
  const t = txt.trim();
  if (t.startsWith('{')) {
    let obj;
    try { obj = JSON.parse(t); }
    catch (e) { return { errors: ['Plik wygląda na JSON, ale nie parsuje się: ' + e.message] }; }
    return parseTrainerPlan(obj);
  }
  const md = parseTrainerPlanMd(t);
  if (md.errors.length) return { errors: md.errors };
  return parseTrainerPlan(md.obj);
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) { console.error('load', e); }
  return defaultState();
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }

// Zapis pliku na urządzenie. Preferuje window.claude.downloads (działa też w przeglądarkach
// wbudowanych w aplikacje mobilne, gdzie zwykły <a download> bywa cicho blokowany).
// Fallback: klasyczny blob + <a download> (dev/localhost, przeglądarki bez tej możliwości).
function saveFile(filename, text, mime) {
  if (window.claude && window.claude.downloads) {
    window.claude.downloads.save({ filename, data: text }).then(() => {
      toast(`Zapisano: ${filename}`);
    }).catch(err => {
      const code = err && err.code;
      if (code === 'declined') return;
      if (code === 'rejected_extension' || code === 'extension_not_enabled') {
        toast(`Nie udało się zapisać ${filename} — spróbuj ponownie.`, 5000);
      } else {
        toast(`Zapis nie powiódł się (${code || 'błąd'}). Spróbuj ponownie za chwilę.`, 5000);
      }
    });
    return;
  }
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function todayISO(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function fmtKg(w) {
  if (w == null) return '—';
  return (Math.round(w * 10) / 10).toString().replace('.', ',') + ' kg';
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function round05(x) { return Math.round(x * 2) / 2; }
function hoursSince(ts) { return (Date.now() - ts) / 36e5; }
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

function phaseDef() { return PLAN_DATA.phases[S.plan.phase]; }

// Rejestr ćwiczeń z planu trenera — exDef() szuka najpierw w planie wbudowanym,
// potem wśród ćwiczeń zdefiniowanych w pliku od trenera.
let CUSTOM_EX = {};
function rebuildCustomEx() {
  CUSTOM_EX = {};
  if (!S.customPlan) return;
  for (const w of S.customPlan.workouts) {
    for (const it of w.items) {
      if (!CUSTOM_EX[it.ex]) {
        CUSTOM_EX[it.ex] = {
          name: it.name,
          elbowSafe: it.elbowSafe,
          straps: it.straps,
          hint: it.hint || null,
          video: it.video || null,
          warnings: it.warnings && it.warnings.length ? it.warnings : null
        };
      }
    }
  }
}
function exDef(id) { return PLAN_DATA.exercises[id] || CUSTOM_EX[id] || { name: id }; }

function phaseDays(ph) {
  const p = PLAN_DATA.phases[ph];
  if (p.inheritDays != null) {
    const base = PLAN_DATA.phases[p.inheritDays].days;
    const out = {};
    for (const d of Object.keys(base)) {
      out[d] = { label: base[d].label, items: [...base[d].items, ...((p.extras && p.extras[d]) || [])] };
    }
    return out;
  }
  return p.days;
}

function itemTargets(item, week) {
  if (item.byWeek) {
    const w = item.byWeek[week] || item.byWeek[1];
    return { sets: w.sets, reps: w.reps, weight: w.weight, note: w.note || null };
  }
  return { sets: item.sets, reps: item.reps, weight: item.weight, note: item.weightLabel || null };
}

function exHistory(exId) {
  const out = [];
  for (const s of S.sessions) {
    for (const e of s.exercises) {
      if (e.ex !== exId || !e.sets.length) continue;
      const weights = e.sets.map(x => x.weight).filter(x => x != null);
      const rpes = e.sets.map(x => x.rpe).filter(x => x != null);
      out.push({
        date: s.date, finishedAt: s.finishedAt, phase: s.phase, week: s.week,
        maxWeight: weights.length ? Math.max(...weights) : null,
        maxRpe: rpes.length ? Math.max(...rpes) : null,
        rpeTarget: e.rpeTarget,
        maxPainDuring: Math.max(0, ...e.sets.map(x => x.pain ?? 0)),
        pain24h: e.pain24h
      });
    }
  }
  out.sort((a, b) => a.date < b.date ? -1 : 1);
  return out;
}

function isPaused(exId) {
  const until = S.paused[exId];
  return until && until >= todayISO() ? until : null;
}
function pauseExercise(exId, days = 7) {
  const d = new Date(); d.setDate(d.getDate() + days);
  S.paused[exId] = todayISO(d);
  save();
}

function progressionBlocked(exId) {
  const h = exHistory(exId).filter(x => x.maxRpe != null);
  if (h.length < 2) return false;
  const [a, b] = h.slice(-2);
  return a.maxRpe > a.rpeTarget + 1 && b.maxRpe > b.rpeTarget + 1;
}

// Silnik progresji. status: 'new' | 'ok' | 'caution' | 'blocked' — steruje kolorem paska na karcie.
function suggestTarget(item, week) {
  const exId = item.ex;
  const t = itemTargets(item, week);
  const planned = t.weight;
  const hist = exHistory(exId);
  const last = hist.length ? hist[hist.length - 1] : null;

  if (!last || last.maxWeight == null) {
    return { weight: planned, reason: planned != null ? 'wg planu' : (t.note || 'dobierz wg RPE'), status: 'new' };
  }

  const hadPain = last.maxPainDuring > 2 || (last.pain24h != null && last.pain24h > 2);
  const anyPain = last.maxPainDuring > 0 || (last.pain24h != null && last.pain24h > 0);
  const blocked = progressionBlocked(exId);
  const rpeOk = last.maxRpe == null || last.maxRpe <= last.rpeTarget + 0.5;

  if (hadPain) {
    return { weight: round05(last.maxWeight * 0.9), reason: 'ból przy ostatniej sesji → −10%', status: 'caution' };
  }
  if (blocked) {
    const w = planned != null ? Math.min(planned, last.maxWeight) : last.maxWeight;
    return { weight: w, reason: '⛔ progresja zablokowana (RPE > cel+1 przez 2 sesje)', status: 'blocked' };
  }
  if (anyPain || !rpeOk) {
    const w = planned != null ? Math.min(planned, last.maxWeight) : last.maxWeight;
    return { weight: w, reason: anyPain ? 'zgłoszony ból → bez progresji' : 'RPE powyżej celu → bez progresji', status: 'caution' };
  }

  if (planned != null) {
    // Plan trenera: zaplanowany ciężar jest wiążący (może być celowo niższy, np. deload).
    // Plan wbudowany: nie cofaj się poniżej ostatnio dźwiganego ciężaru.
    const w = S.customPlan ? planned : Math.max(planned, last.maxWeight);
    return { weight: w, reason: 'wg planu (kryteria progresji spełnione)', status: 'ok' };
  }
  const note = t.note || '';
  if (week === 4) {
    const curPhase = S.customPlan ? 'custom' : S.plan.phase;
    const w1 = hist.filter(h => h.week === 1 && h.phase === curPhase).pop();
    return { weight: w1 ? w1.maxWeight : round05(last.maxWeight * 0.95), reason: 'deload → poziom T1', status: 'ok' };
  }
  if (note.includes('+5%') || note.includes('+obciążenie')) {
    return { weight: round05(last.maxWeight * 1.05), reason: '+5% (RPE i ból OK)', status: 'ok' };
  }
  if (note.includes('+1 kg')) {
    return { weight: last.maxWeight + 1, reason: '+1 kg (RPE i ból OK)', status: 'ok' };
  }
  return { weight: last.maxWeight, reason: 'ten sam ciężar co ostatnio', status: 'ok' };
}

function suggestedDay() {
  const rot = phaseDef().rotation;
  const inPhase = S.sessions.filter(s => s.phase === S.plan.phase);
  if (!inPhase.length) return rot[0];
  const lastDay = inPhase[inPhase.length - 1].day;
  const i = rot.indexOf(lastDay);
  return rot[(i + 1) % rot.length];
}
function lastSessionInfo() {
  const s = S.sessions[S.sessions.length - 1];
  if (!s) return null;
  return { date: s.date, day: s.day, hoursAgo: hoursSince(s.finishedAt || new Date(s.date).getTime()) };
}

function buildSession(day) {
  const week = S.plan.week;
  const items = phaseDays(S.plan.phase)[day].items;
  const rpeT = phaseDef().rpeTarget[week] ?? 6;
  return {
    id: Date.now(),
    date: todayISO(),
    startedAt: Date.now(),
    finishedAt: null,
    phase: S.plan.phase,
    week, day,
    warmup: PLAN_DATA.warmupDefault,
    warmupDone: [],
    exercises: items.map((item, i) => {
      const t = itemTargets(item, week);
      const sug = suggestTarget(item, week);
      return {
        order: i + 1,
        ex: item.ex,
        targetSets: t.sets,
        targetReps: t.reps,
        targetWeight: sug.weight,
        targetNote: t.note,
        suggestReason: sug.reason,
        suggestStatus: sug.status,
        tempo: item.tempo,
        rest: item.rest,
        restLabel: item.restLabel || item.rest + ' s',
        rpeTarget: rpeT,
        optional: !!item.optional,
        sets: [],
        pain24h: null,
        skipped: !!isPaused(item.ex) || !!item.optional
      };
    })
  };
}

function finishSession() {
  const s = S.activeSession;
  if (!s) return;
  s.finishedAt = Date.now();
  s.exercises.forEach(e => { if (!e.sets.length) e.skipped = true; });
  S.sessions.push(s);
  S.activeSession = null;
  let msg = '';
  if (S.customPlan) {
    const left = S.customPlan.workouts.filter(w => !plannedDone(w)).length;
    msg = left ? `Trening zapisany. Zostało ${left} treningów z planu.` : 'Wszystkie treningi z planu wykonane! 🎉 Czas na nowy plan od trenera.';
    save(); stopTimer(); render(true);
    toast(msg, 5000);
    return;
  }
  const p = phaseDef();
  const done = S.sessions.filter(x => x.phase === S.plan.phase && x.week === S.plan.week).length;
  if (done >= p.sessionsPerWeek) {
    if (S.plan.week < p.weeks) {
      S.plan.week++;
      msg = `Tydzień ukończony! Przechodzisz do tygodnia ${S.plan.week} (${p.rpeLabel[S.plan.week]}).`;
    } else if (p.id === 0) {
      msg = 'Faza 0 skompletowana — sprawdź kryteria przejścia do Fazy 1 w zakładce Plan.';
    } else {
      S.plan.week = 1;
      msg = 'Mezocykl ukończony! Nowy mezocykl — tydzień 1 (RPE 6). Ciężary bazują na Twoich ostatnich wynikach.';
    }
  }
  save();
  stopTimer();
  render(true);
  if (msg) toast(msg, 6000);
}

function pendingFollowUps() {
  return S.sessions.filter(s =>
    s.finishedAt && hoursSince(s.finishedAt) >= 20 && hoursSince(s.finishedAt) <= 24 * 7 &&
    s.exercises.some(e => e.sets.length && e.pain24h == null)
  );
}

// ---------------- Timer przerwy (wizualny — bez dźwięku/wibracji/powiadomień) ----------------
const timer = { endsAt: null, exName: '', iv: null };

function startTimer(seconds, exName) {
  timer.endsAt = Date.now() + seconds * 1000;
  timer.exName = exName;
  clearInterval(timer.iv);
  timer.iv = setInterval(tickTimer, 250);
  document.getElementById('rest-timer').classList.remove('hidden');
  tickTimer();
}
function stopTimer() {
  clearInterval(timer.iv);
  timer.endsAt = null;
  document.getElementById('rest-timer').classList.add('hidden');
  document.getElementById('rest-timer').classList.remove('rt-done');
}
function tickTimer() {
  if (!timer.endsAt) return;
  const left = Math.ceil((timer.endsAt - Date.now()) / 1000);
  const box = document.getElementById('rest-timer');
  box.querySelector('.rt-ex').textContent = timer.exName;
  if (left <= 0) {
    box.querySelector('.rt-time').textContent = '0:00';
    box.classList.add('rt-done');
    box.querySelector('.rt-label').textContent = 'Koniec przerwy — dawaj!';
    clearInterval(timer.iv);
    setTimeout(stopTimer, 8000);
    return;
  }
  box.querySelector('.rt-label').textContent = 'Przerwa';
  box.querySelector('.rt-time').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
}
document.getElementById('rest-timer').addEventListener('click', e => {
  const b = e.target.closest('[data-rt]'); if (!b) return;
  const v = b.dataset.rt;
  if (v === 'skip') stopTimer();
  else if (timer.endsAt) { timer.endsAt += (v === '+15' ? 15000 : -15000); tickTimer(); }
});

function showModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;

  return root.querySelector('.modal');
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
function toast(msg, ms = 3500) {
  const t = el(`<div class="toast">${esc(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 20);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, ms);
}

    ? `<label class="warmup-step ${s.warmupDone && s.warmupDone[i] ? 'done' : ''}">

    : `<div class="warmup-step"><span>• ${esc(step)}</span></div>`).join('');

function buildSessionCustom(w) {
  return {
    id: Date.now(),
    date: todayISO(),
    startedAt: Date.now(),
    finishedAt: null,
    phase: 'custom',
    week: w.week || 1,
    day: w.name,
    plannedId: w.id,
    plannedDate: w.date,
    rpeLabelCustom: w.rpeTarget ? `RPE ${w.rpeTarget}` : '',
    warmup: w.warmup || PLAN_DATA.warmupDefault,
    warmupDone: [],
    exercises: w.items.map((item, i) => {
      const t = itemTargets(item, w.week || 0);
      const sug = suggestTarget(item, w.week || 0);
      return {
        order: i + 1,
        ex: item.ex,
        targetSets: t.sets,
        targetReps: t.reps,
        targetWeight: sug.weight,
        targetNote: t.note,
        suggestReason: sug.reason,
        suggestStatus: sug.status,
        tempo: item.tempo,
        rest: item.rest,
        restLabel: item.restLabel || item.rest + ' s',
        rpeTarget: item.rpeTarget ?? w.rpeTarget ?? 6,
        optional: !!item.optional,
        sets: [],
        pain24h: null,
        skipped: !!isPaused(item.ex) || !!item.optional
      };
    })
  };
}

  if (S.activeSession) { renderActiveSession(); return; }
  if (S.customPlan) { renderCustomWorkoutHome(); return; }

  const day = view.dataset.pickedDay && phaseDays(S.plan.phase)[view.dataset.pickedDay] ? view.dataset.pickedDay : suggestedDay();

    `<button class="day-btn ${d === day ? 'active' : ''}" data-day="${d}">${d}${d === suggestedDay() ? '<span class="day-sug">nast.</span>' : ''}</button>`
  ).join('') + `</div>`;

  html += `<div class="day-label">${esc(days[day].label)}</div>`;
  html += warmupCard(PLAN_DATA.warmupDefault, false);
  html += days[day].items.map(item => exPreviewCard(item, week)).join('');
  html += `<button class="btn btn-primary btn-full btn-big" id="start-workout">▶ Rozpocznij trening ${day}</button>`;

  view.innerHTML = html;
  view.querySelectorAll('.day-btn').forEach(b => b.addEventListener('click', () => { view.dataset.pickedDay = b.dataset.day; render(true); }));

// ---------------- WIDOK: aktywna sesja ----------------
function renderActiveSession() {
  const s = S.activeSession;
  const doneSets = s.exercises.reduce((a, e) => a + e.sets.length, 0);
  const allSets = s.exercises.filter(e => !e.skipped).reduce((a, e) => a + e.targetSets, 0);

  const headInfo = s.phase === 'custom'
    ? `<b>${esc(s.day)}</b> · plan trenera${s.rpeLabelCustom ? ' · cel ' + esc(s.rpeLabelCustom) : ''}`
    : `Dzień <b>${esc(s.day)}</b> · Faza ${s.phase} · Tydz. ${s.week} · cel ${esc(phaseDef().rpeLabel[s.week] || '')}`;
  let html = `<div class="session-head">

      <button class="btn btn-danger" id="m-cancel">Anuluj trening</button></div>`);
    document.getElementById('m-cancel').onclick = () => { S.activeSession = null; save(); stopTimer(); closeModal(); render(true); };

function logSet(ei) {
  const s = S.activeSession;
  const e = s.exercises[ei];
  const box = view.querySelector(`.set-input[data-ei="${ei}"]`);
  const reps = parseInt(box.querySelector('.in-reps').value);
  const wRaw = box.querySelector('.in-weight').value;
  const weight = wRaw === '' ? null : parseFloat(wRaw);
  const rpeBtn = box.querySelector('.rpe-chips .sel');
  const painBtn = box.querySelector('.pain-chips .sel');
  const rpe = rpeBtn ? +rpeBtn.dataset.rpe : null;
  const pain = painBtn ? +painBtn.dataset.pain : 0;

  if (!reps || reps < 1) { toast('Podaj liczbę powtórzeń.'); return; }
  if (rpe == null) { toast('Zaznacz RPE serii (potrzebne do progresji).'); return; }

  e.sets.push({ reps, weight, rpe, pain, t: Date.now() });
  save();

  if (pain > 2) {
    showModal(`<h3>⛔ Ból ${pain}/10 — zatrzymaj się</h3>
      <p>Kryterium bezpieczeństwa: ból >2/10 = wypadnij z ćwiczenia na tydzień. Nie „przeczekujemy" bólu łokcia.</p>
      <div class="modal-btns">
        <button class="btn btn-danger btn-full" id="m-pause">Wstrzymaj ${esc(exDef(e.ex).name)} na 7 dni i pomiń</button>
        <button class="btn btn-full" id="m-cont">Kontynuuję świadomie (niezalecane)</button>
      </div>`);
    document.getElementById('m-pause').onclick = () => {
      pauseExercise(e.ex, 7); e.skipped = true; save(); closeModal(); render();
      toast('Ćwiczenie wstrzymane na 7 dni. Dbaj o łokieć. 🧊');
    };
    document.getElementById('m-cont').onclick = () => { closeModal(); startTimer(e.rest, exDef(e.ex).name); render(); };
    return;
  }
  startTimer(e.rest, exDef(e.ex).name);
  render();
}

function historyExportText() {
  if (!S.sessions.length) return 'Brak zapisanych treningów.';
  const lines = [`TRENING — eksport historii (${todayISO()}), ${S.sessions.length} sesji`, ''];
  for (const s of S.sessions) {
    lines.push(`== ${fmtDate(s.date)} · ${s.day} ${s.phase === 'custom' ? '(plan trenera)' : `(Faza ${s.phase}, tydz. ${s.week})`} ==`);

function buildChart(exId) {
  const h = exHistory(exId).filter(x => x.maxWeight != null);
  if (h.length < 1) return '<p class="muted">Za mało danych.</p>';
  const W = 640, H = 220, P = 36;
  const ws = h.map(x => x.maxWeight);
  const min = Math.min(...ws) * 0.92, max = Math.max(...ws) * 1.05 + 0.1;
  const x = i => h.length === 1 ? W / 2 : P + i * (W - 2 * P) / (h.length - 1);
  const y = w => H - P - (w - min) / (max - min) * (H - 2 * P);
  const pts = h.map((p, i) => `${x(i)},${y(p.maxWeight)}`).join(' ');
  const gridY = [0, 0.5, 1].map(f => {
    const w = min + f * (max - min);
    return `<line x1="${P}" y1="${y(w)}" x2="${W - P}" y2="${y(w)}" class="c-grid"/><text x="4" y="${y(w) + 4}" class="c-txt">${Math.round(w)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">
    ${gridY}
    <polyline points="${pts}" class="c-line"/>
    ${h.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.maxWeight)}" r="6" class="${(p.maxPainDuring > 2 || p.pain24h > 2) ? 'c-dot-pain' : 'c-dot'}"/>
      <text x="${x(i)}" y="${y(p.maxWeight) - 12}" class="c-txt c-val">${p.maxWeight}</text>
      <text x="${x(i)}" y="${H - 8}" class="c-txt c-date">${p.date.slice(5).replace('-', '.')}</text>`).join('')}
  </svg>`;
}

function proteinBar(actual, target) {
  const pct = Math.min(100, Math.round(actual / target * 100));
  return `<div class="pbar"><div class="pbar-fill ${pct >= 90 ? 'ok' : ''}" style="width:${pct}%"></div><span>${actual}/${target} g białka (${pct}%)</span></div>`;
}
function weightStagnation() {
  const entries = Object.keys(S.nutrition).sort().map(d => ({ d, w: S.nutrition[d].weight })).filter(x => x.w);
  if (entries.length < 4) return null;
  const last = entries[entries.length - 1];
  const spanStart = entries.find(x => (new Date(last.d) - new Date(x.d)) / 864e5 <= 21 && (new Date(last.d) - new Date(x.d)) / 864e5 >= 14);
  if (!spanStart) return null;
  const days = Math.round((new Date(last.d) - new Date(spanStart.d)) / 864e5);
  return Math.abs(last.w - spanStart.w) < 0.4 ? days : null;
}

  if (rm) rm.addEventListener('click', () => {
    showModal(`<h3>Usunąć plan od trenera?</h3>
      <p>Wrócisz do planu wbudowanego (fazy 0–2). Historia wykonanych treningów zostaje.</p>
      <div class="modal-btns"><button class="btn" onclick="closeModal()">Wróć</button>
      <button class="btn btn-danger" id="m-plan-rm">Usuń plan</button></div>`);
    document.getElementById('m-plan-rm').onclick = () => {
      S.customPlan = null; rebuildCustomEx(); save(); closeModal(); render();
    };
  });
  const file = document.getElementById('plan-file');
  if (file) file.addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    f.text().then(txt => {
      const { plan, errors } = parseTrainerPlanText(txt);
      if (errors.length) {
        showModal(`<h3>Plan zawiera błędy</h3>${errors.slice(0, 12).map(e => `<p class="warn-line">• ${esc(e)}</p>`).join('')}
          ${errors.length > 12 ? `<p class="muted">…i ${errors.length - 12} innych.</p>` : ''}
          <button class="btn btn-full" onclick="closeModal()">OK</button>`);
        return;
      }
      S.customPlan = plan;
      rebuildCustomEx();
      save(); render();
      toast(`Wczytano plan „${plan.meta.nazwa}": ${plan.workouts.length} treningów (${fmtDate(plan.workouts[0].date)} – ${fmtDate(plan.workouts[plan.workouts.length - 1].date)}).`, 6000);
    });
  });
}

function renderPlan() {
  const p = phaseDef();
  const days = phaseDays(S.plan.phase);

  const gate = S.customPlan ? null : phaseGateStatus();

  let html = trainerPlanCard();

  if (!S.customPlan) html += `<div class="card">
    <h3>${esc(p.name)}</h3>
    <p class="muted">${esc(p.desc)}</p>
    <div class="week-ctl">
      Tydzień: <button class="btn btn-sm" id="wk-minus">−</button> <b>${S.plan.week}/${p.weeks}</b> <button class="btn btn-sm" id="wk-plus">+</button>
      <span class="muted">(${esc(p.rpeLabel[S.plan.week] || '')})</span>
    </div>
  </div>`;

  if (gate) {
    html += `<div class="card">
      <h3>Przejście do Fazy ${S.plan.phase + 1}</h3>
      <p class="muted">${esc(p.advanceCriteria)}</p>
      ${gate.checks.map(c => `<div class="gate-check">${c.ok ? '✅' : '❌'} ${esc(c.label)}</div>`).join('')}
      <button class="btn ${gate.allOk ? 'btn-primary' : ''} btn-full" id="advance-phase">
        ${gate.allOk ? '🔓 Przejdź do Fazy ' + (S.plan.phase + 1) : 'Przejdź mimo to (kryteria niespełnione)'}
      </button>
    </div>`;
  }
  if (!S.customPlan && S.plan.phase > 0) {
    html += `<button class="link-btn" id="back-phase">← Wróć do Fazy ${S.plan.phase - 1}</button>`;
  }

  if (!S.customPlan) for (const [d, day] of Object.entries(days)) {
    html += `<details class="card"><summary><b>Dzień ${d}</b> — ${esc(day.label)}</summary>
      ${day.items.map(item => {
        const t = itemTargets(item, S.plan.week);
        const ed = exDef(item.ex);
        return `<div class="plan-ex">
          <div class="ex-head"><div class="ex-name">${esc(ed.name)}</div><div class="ex-badges">${exBadges(item.ex, item)}</div></div>
          <div class="ex-sub">${t.sets}×${esc(t.reps)} · ${t.weight != null ? fmtKg(t.weight) : esc(t.note || 'wg RPE')} · tempo ${esc(item.tempo)} · przerwa ${esc(item.restLabel || item.rest + ' s')}</div>
        </div>`;
      }).join('')}
    </details>`;
  }

  html += `<div class="card"><h3>🛡️ Zasady bezpieczeństwa (zaszyte w apce)</h3>
    <ul class="rules">${PLAN_DATA.safetyRules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>`;

  html += `<div class="card"><h3>⚙️ Ustawienia</h3>
    <div class="nu-grid">
      <div class="nu-field"><label>Waga ciała (kg)</label><input type="number" step="0.1" id="set-bw" value="${S.settings.bodyWeightKg ?? ''}"></div>
      <div class="nu-field"><label>Białko (g/kg)</label><input type="number" step="0.1" min="1.8" max="2.2" id="set-ppk" value="${S.settings.proteinPerKg}"></div>
      <div class="nu-field"><label>Kcal maintenance</label><input type="number" id="set-kcal" value="${S.settings.kcalMaintenance ?? ''}"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" id="btn-export">⬇ Eksport danych</button>
      <button class="btn" id="btn-import">⬆ Import</button>
      <button class="btn btn-danger" id="btn-reset">Reset</button>
    </div>
    <input type="file" id="import-file" accept=".json" class="hidden">
  </div>`;

  view.innerHTML = html;

  bindTrainerPlanCard();
  const wkM = document.getElementById('wk-minus');
  if (wkM) wkM.addEventListener('click', () => { S.plan.week = Math.max(1, S.plan.week - 1); save(); render(); });
  const wkP = document.getElementById('wk-plus');
  if (wkP) wkP.addEventListener('click', () => { S.plan.week = Math.min(p.weeks, S.plan.week + 1); save(); render(); });

  const adv = document.getElementById('advance-phase');
  if (adv) adv.addEventListener('click', () => {
    const ok = gate.allOk;
    showModal(`<h3>${ok ? 'Przejść do Fazy ' + (S.plan.phase + 1) + '?' : '⚠️ Kryteria niespełnione'}</h3>
      <p>${ok ? 'Potwierdzasz brak bólu łokcia przez wymagany okres.' : 'Plan zakłada przejście dopiero po spełnieniu kryteriów bezpieczeństwa. Przejście teraz zwiększa ryzyko nawrotu.'}</p>
      <div class="modal-btns"><button class="btn" onclick="closeModal()">Wróć</button>
      <button class="btn ${ok ? 'btn-primary' : 'btn-danger'}" id="m-adv">Potwierdzam — przejdź</button></div>`);
    document.getElementById('m-adv').onclick = () => {
      S.plan.phase++; S.plan.week = 1; S.plan.phaseStartedOn = todayISO();
      save(); closeModal(); render();
      toast('Faza ' + S.plan.phase + ' odblokowana! 🎉');
    };
  });
  const back = document.getElementById('back-phase');
  if (back) back.addEventListener('click', () => {
    S.plan.phase--; S.plan.week = 1; S.plan.phaseStartedOn = todayISO(); save(); render();
  });

  const bindSet = (id, key) => document.getElementById(id).addEventListener('change', ev => {
    S.settings[key] = ev.target.value === '' ? null : +ev.target.value; save();
  });
  bindSet('set-bw', 'bodyWeightKg'); bindSet('set-ppk', 'proteinPerKg'); bindSet('set-kcal', 'kcalMaintenance');

  document.getElementById('btn-export').addEventListener('click', () => {
    saveFile(`trening-backup-${todayISO()}.json`, JSON.stringify(S, null, 2), 'application/json');
  });
  document.getElementById('btn-import').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    f.text().then(txt => {
      try { S = Object.assign(defaultState(), JSON.parse(txt)); rebuildCustomEx(); save(); render(); toast('Dane zaimportowane.'); }
      catch (e) { toast('Błąd importu: niepoprawny plik.'); }
    });
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    showModal(`<h3>Zresetować wszystkie dane?</h3><p>Usunie treningi, żywienie i rehab. Zrób najpierw eksport!</p>
      <div class="modal-btns"><button class="btn" onclick="closeModal()">Wróć</button>
      <button class="btn btn-danger" id="m-reset">Resetuj</button></div>`);
    document.getElementById('m-reset').onclick = () => { S = defaultState(); rebuildCustomEx(); save(); closeModal(); render(); };
  });
}

function phaseGateStatus() {
  const p = phaseDef();
  if (!p.advanceCriteria || S.plan.phase >= PLAN_DATA.phases.length - 1) return null;
  const inPhase = S.sessions.filter(s => s.phase === S.plan.phase);
  const needWeeks = p.id === 0 ? 2 : 6;
  const needSessions = p.sessionsPerWeek * p.weeks;
  const firstDate = inPhase.length ? new Date(inPhase[0].date) : null;
  const daysIn = firstDate ? Math.floor((Date.now() - firstDate) / 864e5) : 0;
  const anyPain = inPhase.some(s => s.exercises.some(e =>
    e.sets.some(x => (x.pain || 0) > 0) || (e.pain24h != null && e.pain24h > 0)));
  const missing24h = inPhase.some(s => s.exercises.some(e => e.sets.length && e.pain24h == null));
  const checks = [
    { ok: inPhase.length >= needSessions, label: `Min. ${needSessions} sesji w tej fazie (masz ${inPhase.length})` },
    { ok: daysIn >= needWeeks * 7 - 1, label: `Min. ${needWeeks} tyg. w fazie (masz ${daysIn} dni)` },
    { ok: !anyPain, label: 'Zero bólu łokcia w trakcie treningów' },
    { ok: !missing24h, label: 'Wszystkie oceny bólu 24h uzupełnione' }
  ];
  return { checks, allOk: checks.every(c => c.ok) };
}

document.getElementById('app-ver').textContent = 'ver. ' + APP_VERSION;
rebuildCustomEx();
render();
</script>
